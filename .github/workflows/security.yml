name: Security Analysis

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC

# Read-only by default; only the jobs that upload SARIF get security-events
# (zizmor `excessive-permissions`).
permissions:
  contents: read

jobs:
  osv-scanner:
    name: OSV Vulnerability Scanner
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    permissions:
      actions: read
      security-events: write
      contents: read
    with:
      # Known vulnerabilities in the locked dependency set fail the build.
      # False positives: add an OSV-Scanner ignore entry with a justification.
      fail-on-vuln: true

  pip-audit:
    name: pip-audit Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        # --all-extras so pip-audit audits the same dependency set CI tests against;
        # --locked so the audit matches uv.lock exactly
        run: |
          uv sync --locked --all-extras

      - name: Run pip-audit security check
        # Gating on purpose: a known CVE in the locked dependency set must turn
        # CI red. Suppress a confirmed false positive with
        # `--ignore-vuln <ID>` and document why next to the flag.
        run: |
          uv run pip-audit --format json --output pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  bandit-security:
    name: Bandit Security Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Bandit security linter
        # Advisory by design (SAST false-positive rate is high); findings
        # surface in the GitHub Security tab via the SARIF upload below.
        # Pinned (Dependabot does not see uvx specs): bump by hand from
        # https://pypi.org/project/bandit/.
        run: |
          uvx --from "bandit[toml]==1.9.4" bandit -r press/ -f sarif -o bandit-report.sarif || true

      - name: Upload Bandit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('bandit-report.sarif') != ''
        with:
          sarif_file: bandit-report.sarif
          category: bandit

  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    container:
      # Digest-pinned like every action here; the tag is only a label.
      # Bump by hand: docker manifest inspect semgrep/semgrep:<tag>
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        # Advisory by design (SAST false-positive rate is high); findings
        # surface in the GitHub Security tab via the SARIF upload below.
        run: |
          semgrep --config=auto --sarif --output=semgrep-report.sarif . || true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('semgrep-report.sarif') != ''
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep