name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Least privilege: no step writes to PRs or check runs (ruff's github
# output format annotates via stdout; Codecov uploads tokenless).
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.15 graduated from an allow-failure lane after 3.15.0 final
        # (2026-10-09) passed every job.  Admit 3.16 the same way: add it as
        # an `include` entry with `continue-on-error` until pystray/pynput
        # are proven on it, then widen requires-python.
        python-version: ["3.13", "3.14", "3.15"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/requirements*.txt
          uv.lock

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # --locked fails the build if uv.lock is out of date (unlike --frozen, which
      # silently uses a stale lockfile): https://docs.astral.sh/uv/guides/integration/github/
      run: uv sync --locked --all-extras

    - name: Lint with ruff (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check --output-format=github .
        uv run ruff format --check .

    - name: Type check with mypy (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: uv run mypy press/ --num-workers 4

    - name: Test with pytest
      run: uv run pytest --cov=press --cov-report=xml --cov-report=term-missing --cov-report=html
      env:
        PYTHONPATH: .

    - name: Upload coverage reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: coverage-reports-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
