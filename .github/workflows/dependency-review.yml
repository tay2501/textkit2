name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
     - name: 'Checkout Repository'
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

     - name: Dependency Review
       uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
       with:
         # Fail on critical and high severity vulnerabilities
         fail-on-severity: high
         # Allow specific licenses commonly used in Python ecosystem.
         # NOTE: allow-licenses and deny-licenses are mutually exclusive — the
         # action errors out if both are set, which silently broke this whole
         # job from the day it was added.  The allowlist already denies the
         # copyleft licenses the old deny-licenses line listed (GPL-2.0,
         # LGPL-2.0, LGPL-2.1, AGPL-3.0), so keep only this one.
         # MIT-CMU is Pillow's license_expression on PyPI (a permissive
         # MIT-style license); it went unchecked until a lock bump changed Pillow.
         allow-licenses: MIT, MIT-CMU, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, PSF-2.0
         # Four packages are excluded from the license check (purl format, and
         # only ever by exception — all are classification artefacts, not real
         # copyleft dependencies):
         #   pyinstaller       — PyPI metadata reads "GPLv2-or-later with a
         #                       special exception which allows to use
         #                       PyInstaller to build and distribute non-free
         #                       programs (including commercial ones)".  SPDX
         #                       cannot express that exception, so the graph
         #                       reports plain GPL-2.0.  It is also a
         #                       `build`-group tool, never a runtime import.
         #   typing-extensions — its own PyPI `license_expression` is PSF-2.0,
         #                       which is already allowed above; the graph
         #                       derives a composite expression from the bundled
         #                       CPython LICENSE text and reports a stray
         #                       GPL-1.0-or-later term from it.
         #   pyinstaller-hooks-contrib — officially dual-licensed: build-time
         #                       hooks GPL-2.0-or-later (same exception model
         #                       as pyinstaller), runtime hooks — the only part
         #                       bundled into the .exe — Apache-2.0.  `build`
         #                       group only.  The graph reports the union.
         #   docutils          — `docs` group only, never shipped.  The project
         #                       is public domain / BSD; the GPL terms come
         #                       from scanning auxiliary tool files.
         # Both declare the same PyPI classifiers in the versions locked before
         # and after the 2026-11 refresh; the check only fired because that
         # refresh was the first PR to change them.
         allow-dependencies-licenses: pkg:pypi/pyinstaller, pkg:pypi/typing-extensions, pkg:pypi/pyinstaller-hooks-contrib, pkg:pypi/docutils
         # Comment on PR with summary
         comment-summary-in-pr: always
         # Warn on dependencies without licenses
         warn-only: false