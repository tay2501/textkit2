name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
     - name: 'Checkout Repository'
       uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

     - name: Dependency Review
       uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
       with:
         # Fail on critical and high severity vulnerabilities
         fail-on-severity: high
         # Allow specific licenses commonly used in Python ecosystem.
         # NOTE: allow-licenses and deny-licenses are mutually exclusive — the
         # action errors out if both are set, which silently broke this whole
         # job from the day it was added.  The allowlist already denies the
         # copyleft licenses the old deny-licenses line listed (GPL-2.0,
         # LGPL-2.0, LGPL-2.1, AGPL-3.0), so keep only this one.
         allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, PSF-2.0
         # Comment on PR with summary
         comment-summary-in-pr: always
         # Warn on dependencies without licenses
         warn-only: false