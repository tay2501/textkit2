name: Workflow Security (zizmor)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Static analysis of the workflows themselves (template injection, excessive
# permissions, credential persistence, cache poisoning, unpinned uses).
# Findings go to the Security tab; per zizmor-action's README, Advanced
# Security mode does not fail the job on findings.
permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF (public repo: nothing else needed)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The action defaults to the newest zizmor it knows; pin it like
          # every other tool here and bump by hand from PyPI.
          version: "1.31.1"
