version: 2
updates:
  # GitHub Actions の自動バージョン更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    commit-message:
      prefix: "ci"
    # 公開直後の乗っ取りリリースを避ける待機期間。cooldown は version
    # updates のみに効き、security updates は遅延しない（GitHub Docs:
    # Dependabot options reference / cooldown）。
    cooldown:
      default-days: 7

  # Python 依存関係（pyproject.toml + uv.lock）
  # uv エコシステムは uv.lock も更新する（GitHub Changelog 2025-03-13 GA、
  # security updates は 2025-12-16 対応。Astral Docs "Using uv with Dependabot"）。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    commit-message:
      prefix: "build"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
